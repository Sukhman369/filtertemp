<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Filter Flights — Fare Poster Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', sans-serif; background: #0b1329; height: 100vh; overflow: hidden; color: #1e293b; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b1329; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

    /* ══ NATIVE 1080x1440 CANVAS USING filterflights.png ══ */
    #poster {
      width: 1080px;
      height: 1440px;
      position: relative;
      overflow: hidden;
      font-family: 'Barlow Condensed', sans-serif;
      background: url('filterflights.png') no-repeat top left;
      background-size: 1080px 1440px;
      user-select: none;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    }

    /* Tagline */
    .tagline-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 27px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 30, 80, 0.35);
      margin-left: 80px;
      margin-bottom: 6px;
    }

    /* Navy Route Banner Capsule */
    .route-capsule {
      background: linear-gradient(180deg, #00367d 0%, #001e52 100%);
      border: 3px solid #ffffff;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 4px 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 20, 60, 0.35);
      margin: 0 auto;
    }

    /* Segments Capsule Bar */
    .segments-bar {
      width: 950px;
      background: rgba(222, 243, 253, 0.88);
      border: 2px solid rgba(160, 215, 245, 0.85);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 4px 16px;
      box-shadow: 0 4px 14px rgba(0, 30, 80, 0.08);
      margin: 0 auto;
    }
    .segment-cell {
      flex: 1;
      text-align: center;
      color: #002266;
      line-height: 1.2;
      padding: 0 4px;
    }
    .segment-code {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .segment-time {
      font-size: 15px;
      font-weight: 700;
      color: #002266;
    }
    .segment-vdiv {
      width: 1.5px;
      height: 30px;
      background: rgba(0, 34, 102, 0.3);
      flex-shrink: 0;
    }

    /* White Date-Price Card */
    .dp-card {
      width: 790px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 26px rgba(0, 25, 75, 0.12);
      padding: 8px 26px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .dp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1px 0;
    }
    .dp-date {
      font-size: 27px;
      font-weight: 900;
      color: #002266;
      letter-spacing: 0.5px;
      line-height: 1.15;
    }
    .dp-price-badge {
      background: #0082db;
      color: #ffffff;
      font-size: 27px;
      font-weight: 900;
      border-radius: 10px;
      padding: 2px 28px;
      min-width: 170px;
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.15;
      box-shadow: 0 3px 8px rgba(0, 110, 220, 0.28);
    }

    /* Baggage Banner Capsule */
    .baggage-capsule {
      background: linear-gradient(180deg, #00367d 0%, #001e52 100%);
      border: 3px solid #ffffff;
      border-radius: 9999px;
      color: #ffffff;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 4px 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 20, 60, 0.35);
      margin: 0 auto;
    }
  </style>
</head>
<body class="flex">

  <!-- ═══════════════════════════════════════ -->
  <!--  LEFT SIDEBAR: Form Controls           -->
  <!-- ═══════════════════════════════════════ -->
  <aside class="w-96 bg-slate-900 border-r border-slate-800 h-screen flex flex-col flex-shrink-0 z-20">
    <!-- Header -->
    <div class="px-5 py-4 bg-gradient-to-r from-blue-700 to-indigo-800 text-white flex items-center justify-between border-b border-blue-600/40">
      <div>
        <h1 class="text-base font-extrabold tracking-wide flex items-center gap-2">
          <span>✈️</span> Filter Flights Editor
        </h1>
        <p class="text-xs text-blue-200 mt-0.5">Template Poster Generator</p>
      </div>
      <button onclick="resetDefaults()" title="Reset to Original Values" class="text-xs bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded font-bold transition">
        Reset
      </button>
    </div>

    <!-- Scrollable Controls -->
    <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4 text-slate-200 text-xs">

      <!-- ── Airline Selection Block ── -->
      <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-700">
          <span class="font-black text-blue-400 uppercase tracking-wider text-xs">Airline Selection</span>
          <span class="text-[10px] text-slate-400">From /airlines/ folder</span>
        </div>
        <div>
          <label class="font-bold text-slate-300 block mb-1">Choose Airline Logo</label>
          <select id="airline-select" onchange="handleAirlineSelect(this.value)"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 font-semibold cursor-pointer">
            <option value="airlines/malaysia-airlines.svg" selected>Malaysia Airlines</option>
            <option value="airlines/air-india.svg">Air India</option>
            <option value="airlines/indigo.svg">IndiGo</option>
            <option value="airlines/vistara.svg">Vistara</option>
            <option value="airlines/emirates.svg">Emirates</option>
            <option value="airlines/qatar-airways.svg">Qatar Airways</option>
            <option value="airlines/singapore-airlines.svg">Singapore Airlines</option>
            <option value="airlines/thai-airways.svg">Thai Airways</option>
            <option value="airlines/british-airways.svg">British Airways</option>
            <option value="airlines/lufthansa.svg">Lufthansa</option>
            <option value="airlines/air-france.svg">Air France</option>
            <option value="airlines/etihad-airways.svg">Etihad Airways</option>
            <option value="airlines/cathay-pacific.svg">Cathay Pacific</option>
            <option value="airlines/japan-airlines.svg">Japan Airlines</option>
            <option value="airlines/gulf-air.svg">Gulf Air</option>
            <option value="airlines/kuwait-airways.svg">Kuwait Airways</option>
            <option value="airlines/oman-air.svg">Oman Air</option>
            <option value="airlines/air-canada.svg">Air Canada</option>
            <option value="airlines/united-airlines.svg">United Airlines</option>
            <option value="airlines/american-airlines.svg">American Airlines</option>
            <option value="airlines/delta-air-lines.svg">Delta Air Lines</option>
            <option value="airlines/virgin-atlantic.svg">Virgin Atlantic</option>
          </select>
        </div>

        <!-- Live Preview of Selected Logo in Sidebar -->
        <div class="bg-slate-950/60 p-2 rounded-lg border border-slate-700/60 flex items-center justify-center min-h-[50px]">
          <img id="sidebar-logo-preview" src="airlines/malaysia-airlines.svg" alt="Selected Airline" class="max-h-9 max-w-full object-contain">
        </div>

        <div>
          <label class="font-bold text-slate-400 block mb-1">Or Upload Custom Logo</label>
          <input id="airline-logo-input" type="file" accept="image/*" onchange="handleLogoUpload(this)"
            class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
        </div>
      </div>

      <!-- ── Tagline Block ── -->
      <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 space-y-2">
        <label class="font-bold text-slate-300 block">Header Tagline</label>
        <input id="tagline-input" type="text" value="BEST RATES FOR EVERY JOURNEY" oninput="renderPoster()"
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500 font-semibold">
      </div>

      <!-- ── Route 1 Block ── -->
      <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-700">
          <span class="font-black text-blue-400 uppercase tracking-wider text-xs">Route 1</span>
          <span class="text-[10px] text-slate-400">Primary Route</span>
        </div>
        <div>
          <label class="font-bold text-slate-300 block mb-1">Route Title</label>
          <input id="r1-name" type="text" value="DELHI – BALI – DELHI" oninput="renderPoster()"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500 font-semibold">
        </div>
        <div>
          <label class="font-bold text-slate-300 block mb-1">Flight Segments (4 pills)</label>
          <div id="r1-segments" class="space-y-1.5">
            <input type="text" value="MH 191 DEL-KUL | 23:00 – 06:55" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
            <input type="text" value="MH 715 KUL-DPS | 09:00 – 12:05" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
            <input type="text" value="MH 714 DPS-KUL | 13:05 – 16:00" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
            <input type="text" value="MH 190 KUL-DEL | 18:50 – 21:50" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
          </div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-bold text-slate-300">Date – Price Rows</label>
            <button onclick="addRow(1)" class="text-blue-400 hover:text-blue-300 font-bold text-[11px]">+ Add Row</button>
          </div>
          <div id="r1-rows" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- ── Route 2 Block ── -->
      <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-700">
          <span class="font-black text-blue-400 uppercase tracking-wider text-xs">Route 2</span>
          <span class="text-[10px] text-slate-400">Secondary Route</span>
        </div>
        <div>
          <label class="font-bold text-slate-300 block mb-1">Route Title</label>
          <input id="r2-name" type="text" value="AMRITSAR – BALI – AMRITSAR" oninput="renderPoster()"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500 font-semibold">
        </div>
        <div>
          <label class="font-bold text-slate-300 block mb-1">Flight Segments (4 pills)</label>
          <div id="r2-segments" class="space-y-1.5">
            <input type="text" value="MH 119 ATQ-KUL | 23:15 – 06:10" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
            <input type="text" value="MH 715 KUL-DPS | 09:00 – 12:05" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
            <input type="text" value="MH 714 DPS-KUL | 12:55 – 16:00" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
            <input type="text" value="MH 118 KUL-ATQ | 17:15 – 20:40" oninput="renderPoster()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:border-blue-500">
          </div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-bold text-slate-300">Date – Price Rows</label>
            <button onclick="addRow(2)" class="text-blue-400 hover:text-blue-300 font-bold text-[11px]">+ Add Row</button>
          </div>
          <div id="r2-rows" class="space-y-1.5 max-h-40 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <!-- ── Baggage Block ── -->
      <div class="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-2">
        <div class="pb-1 border-b border-slate-700">
          <span class="font-black text-blue-400 uppercase tracking-wider text-xs">Baggage Allowance</span>
        </div>
        <div>
          <label class="font-bold text-slate-300 block mb-1">Baggage Banner Text</label>
          <input id="baggage-text" type="text" value="BAGGAGE: 30KG + 7KG" oninput="renderPoster()"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500 font-semibold">
        </div>
      </div>

    </div>

    <!-- Download Section -->
    <div class="p-4 bg-slate-950 border-t border-slate-800 space-y-2">
      <button id="download-btn" onclick="downloadPoster()"
        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-3 rounded-xl shadow-lg shadow-blue-500/30 transition text-sm flex items-center justify-center gap-2">
        <span>⬇</span> Download High-Res Poster
      </button>
      <div class="text-[10px] text-slate-500 text-center">
        Native 1080 × 1440 Ultra-Crisp PNG Export
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════ -->
  <!--  RIGHT CANVAS PREVIEW AREA             -->
  <!-- ═══════════════════════════════════════ -->
  <main id="preview-container" class="flex-1 bg-slate-950 overflow-auto flex items-center justify-center p-6 relative">
    <div id="poster-scale-wrapper" class="origin-center transition-transform">
      <div id="poster">

        <!-- ══ MIDDLE EDITABLE CONTENT ══ -->
        <!-- Placed between header bottom (~y=175) and visit website pill (~y=1215) -->
        <div style="position: absolute; top: 172px; left: 0; width: 1080px; display: flex; flex-direction: column;">

          <!-- 0. Tagline -->
          <div class="tagline-text" id="p-tagline">BEST RATES FOR EVERY JOURNEY</div>

          <!-- 1. Route 1 Capsule -->
          <div class="route-capsule" id="p-r1-name">DELHI – BALI – DELHI</div>

          <!-- 2. Airline Logo -->
          <div style="margin: 6px 0 5px; height: 50px; display: flex; align-items: center; justify-content: center;">
            <img id="p-airline-logo" src="airlines/malaysia-airlines.svg" alt="Airline Logo"
              style="max-height: 48px; max-width: 380px; object-fit: contain;">
          </div>

          <!-- 3. Segments Bar 1 -->
          <div class="segments-bar" id="p-r1-segments"></div>

          <!-- 4. Date-Price Card 1 -->
          <div class="dp-card" id="p-r1-dp" style="margin-top: 6px;"></div>

          <!-- 5. Route 2 Capsule -->
          <div class="route-capsule" id="p-r2-name" style="margin-top: 8px;">AMRITSAR – BALI – AMRITSAR</div>

          <!-- 6. Segments Bar 2 -->
          <div class="segments-bar" id="p-r2-segments" style="margin-top: 6px;"></div>

          <!-- 7. Date-Price Card 2 -->
          <div class="dp-card" id="p-r2-dp" style="margin-top: 6px;"></div>

          <!-- 8. Baggage Capsule -->
          <div class="baggage-capsule" id="p-baggage" style="margin-top: 8px;">BAGGAGE: 30KG + 7KG</div>

        </div>
        <!-- /middle -->

      </div>
    </div>
  </main>

  <script>
    const defaultData = {
      tagline: "BEST RATES FOR EVERY JOURNEY",
      r1Name: "DELHI – BALI – DELHI",
      r2Name: "AMRITSAR – BALI – AMRITSAR",
      r1Segs: [
        "MH 191 DEL-KUL | 23:00 – 06:55",
        "MH 715 KUL-DPS | 09:00 – 12:05",
        "MH 714 DPS-KUL | 13:05 – 16:00",
        "MH 190 KUL-DEL | 18:50 – 21:50"
      ],
      r2Segs: [
        "MH 119 ATQ-KUL | 23:15 – 06:10",
        "MH 715 KUL-DPS | 09:00 – 12:05",
        "MH 714 DPS-KUL | 12:55 – 16:00",
        "MH 118 KUL-ATQ | 17:15 – 20:40"
      ],
      r1Rows: [
        ["16 JAN – 23 JAN", "₹49,999"],
        ["20 JAN – 27 JAN", "₹52,999"],
        ["23 JAN – 30 JAN", "₹52,999"],
        ["30 JAN – 06 FEB", "₹51,999"],
        ["10 FEB – 17 FEB", "₹49,999"],
        ["17 FEB – 24 FEB", "₹48,999"],
        ["20 FEB – 27 FEB", "₹48,999"],
        ["27 FEB – 06 MAR", "₹48,999"]
      ],
      r2Rows: [
        ["03 DEC – 10 DEC", "₹49,999"],
        ["10 DEC – 17 DEC", "₹52,999"]
      ],
      baggage: "BAGGAGE: 30KG + 7KG",
      airline: "airlines/malaysia-airlines.svg"
    };

    function addRow(route, date = "", price = "") {
      const c = document.getElementById(`r${route}-rows`);
      const row = document.createElement('div');
      row.className = "flex gap-1.5 items-center";
      row.innerHTML = `
        <input type="text" placeholder="e.g. 16 JAN – 23 JAN" value="${date}" oninput="renderPoster()"
          class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:border-blue-500 font-medium">
        <input type="text" placeholder="₹49,999" value="${price}" oninput="renderPoster()"
          class="w-20 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:border-blue-500 font-medium">
        <button onclick="this.parentElement.remove(); renderPoster();"
          class="text-red-400 hover:text-red-300 font-black text-sm px-1 leading-none">✕</button>
      `;
      c.appendChild(row);
      renderPoster();
    }

    function getSegments(route) {
      return Array.from(document.querySelectorAll(`#r${route}-segments input`)).map(inp => {
        const parts = inp.value.split('|');
        return {
          code: (parts[0] || '').trim(),
          time: (parts[1] || '').trim()
        };
      });
    }

    function buildSegmentsHTML(segs) {
      return segs.map((s, idx) => `
        ${idx > 0 ? '<div class="segment-vdiv"></div>' : ''}
        <div class="segment-cell">
          <div class="segment-code">${s.code}</div>
          <div class="segment-time">${s.time}</div>
        </div>
      `).join('');
    }

    function getRows(route) {
      return Array.from(document.querySelectorAll(`#r${route}-rows > div`)).map(r => {
        const inputs = r.querySelectorAll('input');
        return {
          date: inputs[0]?.value || '',
          price: inputs[1]?.value || ''
        };
      });
    }

    function buildRowsHTML(rows) {
      return rows.map(r => `
        <div class="dp-row">
          <span class="dp-date">${r.date}</span>
          <span class="dp-price-badge">${r.price}</span>
        </div>
      `).join('');
    }

    function renderPoster() {
      // 0. Tagline
      document.getElementById('p-tagline').textContent = document.getElementById('tagline-input').value;

      // 1. Route names
      document.getElementById('p-r1-name').textContent = document.getElementById('r1-name').value;
      document.getElementById('p-r2-name').textContent = document.getElementById('r2-name').value;

      // 2. Flight Segments
      document.getElementById('p-r1-segments').innerHTML = buildSegmentsHTML(getSegments(1));
      document.getElementById('p-r2-segments').innerHTML = buildSegmentsHTML(getSegments(2));

      // 3. Date-Price Rows
      document.getElementById('p-r1-dp').innerHTML = buildRowsHTML(getRows(1));
      document.getElementById('p-r2-dp').innerHTML = buildRowsHTML(getRows(2));

      // 4. Baggage
      document.getElementById('p-baggage').textContent = document.getElementById('baggage-text').value;
    }

    function handleAirlineSelect(src) {
      document.getElementById('p-airline-logo').src = src;
      document.getElementById('sidebar-logo-preview').src = src;
      document.getElementById('airline-logo-input').value = "";
    }

    function handleLogoUpload(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('p-airline-logo').src = e.target.result;
        document.getElementById('sidebar-logo-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetDefaults() {
      document.getElementById('tagline-input').value = defaultData.tagline;
      document.getElementById('r1-name').value = defaultData.r1Name;
      document.getElementById('r2-name').value = defaultData.r2Name;
      document.getElementById('baggage-text').value = defaultData.baggage;
      document.getElementById('airline-select').value = defaultData.airline;
      handleAirlineSelect(defaultData.airline);

      const r1SegInputs = document.querySelectorAll('#r1-segments input');
      defaultData.r1Segs.forEach((val, idx) => { if (r1SegInputs[idx]) r1SegInputs[idx].value = val; });

      const r2SegInputs = document.querySelectorAll('#r2-segments input');
      defaultData.r2Segs.forEach((val, idx) => { if (r2SegInputs[idx]) r2SegInputs[idx].value = val; });

      document.getElementById('r1-rows').innerHTML = "";
      defaultData.r1Rows.forEach(([d, p]) => addRow(1, d, p));

      document.getElementById('r2-rows').innerHTML = "";
      defaultData.r2Rows.forEach(([d, p]) => addRow(2, d, p));

      renderPoster();
    }

    function fitPosterToScreen() {
      const wrapper = document.getElementById('poster-scale-wrapper');
      const container = document.getElementById('preview-container');
      const padX = 60, padY = 60;
      const availW = container.clientWidth - padX;
      const availH = container.clientHeight - padY;
      const scale = Math.min(availW / 1080, availH / 1440);
      wrapper.style.transform = `scale(${scale})`;
    }

    async function downloadPoster() {
      const btn = document.getElementById('download-btn');
      btn.innerHTML = `<span>⏳</span> Rendering Ultra-HD PNG…`;
      btn.disabled = true;

      try {
        const poster = document.getElementById('poster');
        const wrapper = document.getElementById('poster-scale-wrapper');

        // Temporarily reset transform for 1:1 pixel-perfect capture
        const prevTransform = wrapper.style.transform;
        wrapper.style.transform = 'none';

        // Wait for fonts & images to settle
        await document.fonts.ready;

        const canvas = await html2canvas(poster, {
          width: 1080,
          height: 1440,
          scale: 1, // exact 1080x1440 native master resolution
          useCORS: true,
          backgroundColor: null,
          logging: false
        });

        // Restore scale in preview
        wrapper.style.transform = prevTransform;

        // Trigger download
        const a = document.createElement('a');
        const r1 = document.getElementById('r1-name').value.replace(/[^a-zA-Z0-9]/g, '_');
        a.download = `filter-flights-${r1}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      } catch (err) {
        alert("Download failed. Please check browser console.");
        console.error(err);
      } finally {
        btn.innerHTML = `<span>⬇</span> Download High-Res Poster`;
        btn.disabled = false;
      }
    }

    // Initialize
    defaultData.r1Rows.forEach(([d, p]) => addRow(1, d, p));
    defaultData.r2Rows.forEach(([d, p]) => addRow(2, d, p));
    renderPoster();
    window.addEventListener('resize', fitPosterToScreen);
    document.fonts.ready.then(fitPosterToScreen);
    setTimeout(fitPosterToScreen, 100);
  </script>
</body>
</html>
