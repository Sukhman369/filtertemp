<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filter Flights — Poster Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Barlow', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-200 h-screen flex overflow-hidden text-gray-800">

  <!-- ════════════════════════════════════ -->
  <!--  LEFT PANEL — Form Controls         -->
  <!-- ════════════════════════════════════ -->
  <aside class="w-80 bg-white shadow-xl overflow-y-auto flex-shrink-0 flex flex-col h-full">

    <div class="sticky top-0 z-10 bg-blue-700 px-4 py-3 text-white">
      <h1 class="text-lg font-bold">🎨 Poster Editor</h1>
      <p class="text-xs text-blue-200">Changes update live</p>
    </div>

    <div class="p-4 space-y-5 pb-10">

      <!-- ── Route 1 ── -->
      <section class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-700 border-b border-blue-100 pb-1">Route 1</h2>
        <div>
          <label class="text-xs font-semibold text-gray-600">Route Title</label>
          <input id="r1-name" type="text" value="DELHI – BALI – DELHI"
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Flight Segments</label>
          <div class="mt-1 space-y-1" id="r1-segments">
            <input type="text" value="MH 191 DEL-KUL | 23:00 – 06:55"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
            <input type="text" value="MH 715 KUL-DPS | 09:00 – 12:05"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
            <input type="text" value="MH 714 DPS-KUL | 13:05 – 16:00"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
            <input type="text" value="MH 190 KUL-DEL | 18:50 – 21:50"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Date – Price Rows</label>
          <div class="mt-1 space-y-1" id="r1-rows"></div>
          <button onclick="addRow(1)" class="mt-1 text-xs text-blue-600 hover:underline font-semibold">+ Add Row</button>
        </div>
      </section>

      <!-- ── Route 2 ── -->
      <section class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-700 border-b border-blue-100 pb-1">Route 2</h2>
        <div>
          <label class="text-xs font-semibold text-gray-600">Route Title</label>
          <input id="r2-name" type="text" value="AMRITSAR – BALI – AMRITSAR"
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Flight Segments</label>
          <div class="mt-1 space-y-1" id="r2-segments">
            <input type="text" value="MH 119 ATQ-KUL | 23:15 – 06:10"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
            <input type="text" value="MH 715 KUL-DPS | 09:00 – 12:05"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
            <input type="text" value="MH 714 DPS-KUL | 12:55 – 16:00"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
            <input type="text" value="MH 118 KUL-ATQ | 17:15 – 20:40"
              class="w-full border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Date – Price Rows</label>
          <div class="mt-1 space-y-1" id="r2-rows"></div>
          <button onclick="addRow(2)" class="mt-1 text-xs text-blue-600 hover:underline font-semibold">+ Add Row</button>
        </div>
      </section>

      <!-- ── Airline Logo ── -->
      <section class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-700 border-b border-blue-100 pb-1">Airline Logo</h2>
        <input id="airline-logo-input" type="file" accept="image/*"
          class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <p class="text-xs text-gray-400">Defaults to placeholder if no file uploaded</p>
      </section>

      <!-- ── Extras ── -->
      <section class="space-y-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-700 border-b border-blue-100 pb-1">Extras</h2>
        <div>
          <label class="text-xs font-semibold text-gray-600">Baggage Text</label>
          <input id="baggage-text" type="text" value="BAGGAGE: 30KG + 7KG"
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">CTA Pill Text</label>
          <input id="cta-text" type="text" value="Visit our website for Special I Fares"
            class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-400">
        </div>
      </section>

      <!-- ── Download ── -->
      <button id="download-btn"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg transition-colors text-sm">
        ⬇ Download PNG
      </button>

    </div>
  </aside>

  <!-- ════════════════════════════════════ -->
  <!--  RIGHT PANEL — Live Preview         -->
  <!-- ════════════════════════════════════ -->
  <main class="flex-1 overflow-auto flex items-start justify-center py-8 px-6 bg-slate-200">
    <div id="poster-wrapper" class="shadow-2xl rounded-xl overflow-hidden">
      <div id="poster" style="width:680px; min-height:900px; background:#87ceeb; display:flex; align-items:center; justify-content:center;">
        <p style="color:rgba(255,255,255,0.8); font-size:14px;">Poster design loads in next step…</p>
      </div>
    </div>
  </main>

</body>
<script>
  const defaultRows = {
    1: [
      ["16 JAN – 23 JAN", "₹49,999"],
      ["20 JAN – 27 JAN", "₹52,999"],
      ["23 JAN – 30 JAN", "₹52,999"],
      ["30 JAN – 06 FEB", "₹51,999"],
      ["10 FEB – 17 FEB", "₹49,999"],
      ["17 FEB – 24 FEB", "₹48,999"],
      ["20 FEB – 27 FEB", "₹48,999"],
      ["27 FEB – 06 MAR", "₹48,999"],
    ],
    2: [
      ["03 DEC – 10 DEC", "₹49,999"],
      ["10 DEC – 17 DEC", "₹52,999"],
    ]
  };

  function addRow(route, date = "", price = "") {
    const container = document.getElementById(`r${route}-rows`);
    const row = document.createElement('div');
    row.className = 'flex gap-1 items-center';
    row.innerHTML = `
      <input type="text" placeholder="e.g. 16 JAN – 23 JAN" value="${date}"
        class="flex-1 border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400"
        oninput="renderPoster()">
      <input type="text" placeholder="₹00,000" value="${price}"
        class="w-20 border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-blue-400"
        oninput="renderPoster()">
      <button onclick="this.parentElement.remove(); renderPoster();"
        class="text-red-400 hover:text-red-600 text-sm font-bold px-1">✕</button>
    `;
    container.appendChild(row);
  }

  // Initialise default rows
  [1, 2].forEach(r => defaultRows[r].forEach(([d, p]) => addRow(r, d, p)));

  function renderPoster() { /* wired in Step 3 */ }
</script>
</html>
